<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Current Location</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #667085;
        --line: #dfe5ef;
        --surface: rgba(255, 255, 255, 0.94);
        --accent: #3457d5;
        --accent-dark: #2743ad;
        --soft: #eef2ff;
        --shadow: 0 24px 70px rgba(35, 53, 94, 0.16);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 10%, rgba(118, 151, 255, 0.24), transparent 30%),
          radial-gradient(circle at 95% 90%, rgba(67, 203, 190, 0.18), transparent 32%),
          #f5f7fb;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      main {
        width: min(100%, 960px);
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(16px);
      }

      .intro {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-end;
        padding: 34px 38px 26px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 1;
        letter-spacing: -0.055em;
      }

      .description {
        max-width: 490px;
        margin: 14px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      button {
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: white;
        padding: 14px 18px;
        font: inherit;
        font-weight: 750;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 10px 22px rgba(52, 87, 213, 0.26);
        transition: transform 160ms ease, background 160ms ease, opacity 160ms ease;
      }

      button:hover { background: var(--accent-dark); transform: translateY(-1px); }
      button:active { transform: translateY(0); }
      button:focus-visible { outline: 3px solid rgba(52, 87, 213, 0.3); outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: 0.64; transform: none; }

      .status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 14px 38px;
        background: #fbfcff;
        border-top: 1px solid #eef1f6;
        border-bottom: 1px solid #eef1f6;
      }

      #status { margin: 0; color: var(--muted); font-size: 0.92rem; }

      #coordinates {
        margin: 0;
        color: var(--accent-dark);
        font-size: 0.84rem;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      #map {
        width: 100%;
        min-height: 470px;
        background: #dfe7ef;
      }

      .map-caption {
        padding: 13px 38px 16px;
        color: var(--muted);
        font-size: 0.76rem;
      }

      @media (max-width: 680px) {
        body { padding: 12px; place-items: start center; }
        main { border-radius: 21px; margin-top: 8px; }
        .intro { display: block; padding: 28px 22px 23px; }
        .description { margin-top: 12px; }
        button { width: 100%; margin-top: 22px; }
        .status-row { display: block; padding: 14px 22px; }
        #coordinates { margin-top: 7px; text-align: left; }
        #map { min-height: 390px; }
        .map-caption { padding-inline: 22px; }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Location POC</p>
          <h1 id="page-title">Where am I?</h1>
          <p class="description">Allow location access to place your current position on the map. Your location stays in this browser tab.</p>
        </div>
        <button id="locate-button" type="button">Get my location</button>
      </section>

      <section class="status-row" aria-live="polite">
        <p id="status">Ready when you are.</p>
        <p id="coordinates">No location selected</p>
      </section>

      <div id="map" role="application" aria-label="Map showing your current location"></div>
      <div class="map-caption">Map data © OpenStreetMap contributors</div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const button = document.querySelector('#locate-button');
      const status = document.querySelector('#status');
      const coordinates = document.querySelector('#coordinates');
      const map = L.map('map', { zoomControl: true }).setView([20, 0], 2);
      let marker;
      let accuracyCircle;

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      function renderLocation(position) {
        const { latitude, longitude, accuracy } = position.coords;
        const point = [latitude, longitude];

        if (marker) map.removeLayer(marker);
        if (accuracyCircle) map.removeLayer(accuracyCircle);

        marker = L.marker(point).addTo(map).bindPopup('You are here').openPopup();
        accuracyCircle = L.circle(point, {
          radius: accuracy,
          color: '#3457d5',
          fillColor: '#6f8cff',
          fillOpacity: 0.18,
          weight: 2
        }).addTo(map);

        map.setView(point, Math.max(15, map.getZoom()));
        status.textContent = 'Location found. The marker shows your current position.';
        coordinates.textContent = `${latitude.toFixed(5)}, ${longitude.toFixed(5)} · ±${Math.round(accuracy)} m`;
        button.disabled = false;
      }

      function handleLocationError(error) {
        const messages = {
          1: 'Location permission was denied. Please allow access and try again.',
          2: 'Your location could not be determined. Please try again.',
          3: 'The location request timed out. Please try again.'
        };
        status.textContent = messages[error.code] || 'Something went wrong while finding your location.';
        coordinates.textContent = 'No location selected';
        button.disabled = false;
      }

      button.addEventListener('click', () => {
        if (!('geolocation' in navigator)) {
          status.textContent = 'Geolocation is not supported by this browser.';
          button.disabled = false;
          return;
        }

        button.disabled = true;
        status.textContent = 'Requesting your location…';
        navigator.geolocation.getCurrentPosition(renderLocation, handleLocationError, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        });
      });
    </script>
  </body>
</html>
